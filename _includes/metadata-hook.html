<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link
  rel="alternate"
  type="application/atom+xml"
  title="{{ site.title | escape }}"
  href="{{ '/feed.xml' | absolute_url }}"
>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a[href^="http://"], a[href^="https://"]').forEach(function (link) {
      if (link.hostname !== window.location.hostname) {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
      }
    });
  });
</script>
